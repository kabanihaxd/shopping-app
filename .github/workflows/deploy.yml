name: Deploy to GitHub Pages

# Сайт переехал на Firebase Hosting (shopping-app-78237.web.app).
# На старом адресе GitHub Pages теперь только страница-указатель на новый адрес
# и ngsw-worker.js, который удаляет у посетителей старую офлайн-копию приложения.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
